<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E7E7EE" />
    <link rel="icon" type="image/png" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <title>MidatoPay × Arc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: 'Poppins', -apple-system, system-ui, sans-serif;
        background: #E7E7EE;
        background-image: radial-gradient(900px 500px at 50% -10%, #F3EDFF 0%, #E7E7EE 60%);
      }

      /* Escenario: centra la app en pantallas grandes */
      .mp-stage {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 26px 16px;
      }

      /* Marco tipo teléfono */
      .mp-device {
        position: relative;
        width: 100%;
        max-width: 400px;
        height: min(840px, calc(100dvh - 52px));
        background: #FFFFFF;
        border-radius: 34px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow:
          0 40px 90px rgba(24, 24, 44, .20),
          0 8px 24px rgba(24, 24, 44, .08),
          0 0 0 1px rgba(24, 24, 44, .05);
      }

      .mp-scroll {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .mp-scroll::-webkit-scrollbar { width: 0; }

      /* Barra inferior glass + FAB cromado naranja */
      @property --fab-angle {
        syntax: "<angle>";
        initial-value: 0deg;
        inherits: false;
      }
      .mp-nav {
        position: absolute;
        left: 10px;
        right: 10px;
        bottom: 10px;
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.88) 0%,
          rgba(255, 248, 242, 0.72) 48%,
          rgba(255, 236, 224, 0.78) 100%
        );
        backdrop-filter: blur(22px) saturate(1.55);
        -webkit-backdrop-filter: blur(22px) saturate(1.55);
        border: 1px solid rgba(255, 181, 141, 0.45);
        border-radius: 26px;
        padding: 10px 12px 12px;
        display: flex;
        align-items: center;
        overflow: visible;
        box-shadow:
          0 12px 40px rgba(254, 108, 28, 0.12),
          0 2px 0 rgba(255, 255, 255, 0.82) inset,
          0 -1px 0 rgba(254, 108, 28, 0.08) inset;
      }
      .mp-nav::before {
        content: "";
        position: absolute;
        left: 8%;
        right: 8%;
        top: 1px;
        height: 1px;
        background: linear-gradient(
          90deg,
          transparent 0%,
          rgba(255, 255, 255, 0.7) 50%,
          transparent 100%
        );
        pointer-events: none;
        z-index: 1;
      }
      .mp-fab {
        position: absolute;
        left: 50%;
        transform: translate(-50%, -28px);
        width: 64px;
        height: 64px;
        border-radius: 50%;
        background:
          radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0) 40%),
          conic-gradient(
            from var(--fab-angle),
            #ffd0b2 0deg,
            #ffb58d 70deg,
            #fe6c1c 150deg,
            #e85a10 220deg,
            #fe6c1c 290deg,
            #ffb58d 330deg,
            #ffd0b2 360deg
          );
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        color: #fff;
        cursor: pointer;
        display: grid;
        place-items: center;
        overflow: hidden;
        z-index: 3;
        box-shadow:
          0 14px 34px rgba(254, 108, 28, 0.42),
          0 2px 0 rgba(255, 255, 255, 0.45) inset,
          0 -6px 14px rgba(180, 55, 0, 0.22) inset;
        animation: mp-fab-spin 7s linear infinite;
        transition: transform .18s ease;
      }
      .mp-fab-shine {
        display: none;
      }
      .mp-fab:active {
        transform: translate(-50%, -28px) scale(.94);
      }
      .mp-fab.is-listening {
        box-shadow:
          0 18px 48px rgba(254, 108, 28, 0.5),
          0 0 0 6px rgba(254, 108, 28, 0.14),
          0 2px 0 rgba(255, 255, 255, 0.5) inset,
          0 -8px 18px rgba(180, 55, 0, 0.22) inset;
      }
      /* Cliente externo: paleta morada (no MidatoPay) */
      .mp-guest .mp-nav {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.9) 0%,
          rgba(246, 244, 252, 0.78) 48%,
          rgba(238, 235, 248, 0.82) 100%
        );
        border: 1px solid rgba(91, 77, 183, 0.28);
        box-shadow:
          0 12px 40px rgba(91, 77, 183, 0.12),
          0 2px 0 rgba(255, 255, 255, 0.82) inset,
          0 -1px 0 rgba(91, 77, 183, 0.08) inset;
      }
      .mp-guest .mp-fab {
        background:
          radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.38) 0%, rgba(255, 255, 255, 0) 40%),
          conic-gradient(
            from var(--fab-angle),
            #b7afe0 0deg,
            #8b7fd4 70deg,
            #5b4db7 150deg,
            #4338a0 220deg,
            #5b4db7 290deg,
            #8b7fd4 330deg,
            #b7afe0 360deg
          );
        box-shadow:
          0 14px 34px rgba(91, 77, 183, 0.42),
          0 2px 0 rgba(255, 255, 255, 0.45) inset,
          0 -6px 14px rgba(50, 40, 120, 0.28) inset;
      }
      .mp-guest-scan {
        position: relative;
        min-height: 100%;
        height: 100%;
        background: #0b0b0d;
        color: #fff;
        overflow: hidden;
      }
      .mp-guest-scan-top {
        position: absolute;
        top: 14px;
        left: 14px;
        right: 14px;
        z-index: 5;
        display: flex;
        justify-content: space-between;
      }
      .mp-guest-scan-iconbtn {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: none;
        background: rgba(0,0,0,.35);
        color: #fff;
        font-size: 28px;
        line-height: 1;
        cursor: pointer;
        font-family: inherit;
      }
      .mp-guest-scan-stage {
        position: absolute;
        inset: 0;
        overflow: hidden;
      }
      .mp-guest-scan-frame {
        position: absolute;
        left: 50%;
        top: 42%;
        width: 70%;
        max-width: 260px;
        aspect-ratio: 1;
        transform: translate(-50%, -50%);
        border: 2px dashed rgba(255,255,255,.85);
        border-radius: 18px;
        box-shadow: 0 0 0 999px rgba(0,0,0,.28);
        pointer-events: none;
        z-index: 2;
      }
      .mp-guest-scan-laser {
        position: absolute;
        left: 50%;
        top: 42%;
        width: 70%;
        max-width: 260px;
        height: 2px;
        transform: translate(-50%, -50%);
        background: linear-gradient(90deg, transparent, #5B4DB7, transparent);
        animation: mp-guest-laser 2.2s ease-in-out infinite;
        pointer-events: none;
        z-index: 3;
      }
      @keyframes mp-guest-laser {
        0%, 100% { transform: translate(-50%, -90px); opacity: .35; }
        50% { transform: translate(-50%, 90px); opacity: 1; }
      }
      .mp-guest-scan-bottom {
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 4;
        padding: 20px 22px 28px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 16px;
        background: transparent;
        pointer-events: none;
      }
      .mp-guest-scan-bottom > * {
        pointer-events: auto;
      }
      .mp-guest-scan-flash {
        width: 52px;
        height: 52px;
        border-radius: 50%;
        border: none;
        background: rgba(0,0,0,.4);
        color: #fff;
        display: grid;
        place-items: center;
        cursor: pointer;
        font-family: inherit;
        padding: 0;
      }
      .mp-guest-scan-flash.is-on {
        background: rgba(91, 77, 183, 0.92);
        color: #fff;
      }
      /* Pagar logueado: misma UI de scan, paleta naranja MidatoPay */
      .mp-pay-scan .mp-guest-scan-laser {
        background: linear-gradient(90deg, transparent, #fe6c1c, transparent);
      }
      .mp-pay-scan .mp-guest-scan-flash.is-on {
        background: rgba(254, 108, 28, 0.92);
        color: #fff;
      }
      .mp-voice-sheet {
        position: absolute;
        inset: 0 0 128px 0;
        z-index: 35;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        padding: 18px 18px 8px;
        background: rgba(255, 255, 255, 0.78);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        overflow-y: auto;
      }

      /* Orbe cromado grande (pantalla voz) */
      .mp-chrome-orb {
        width: 124px;
        height: 124px;
        border-radius: 50%;
        border: 1.5px solid rgba(255, 255, 255, 0.55);
        color: #fff;
        cursor: pointer;
        display: grid;
        place-items: center;
        overflow: hidden;
        background:
          radial-gradient(circle at 32% 24%, rgba(255, 255, 255, 0.42) 0%, rgba(255, 255, 255, 0) 42%),
          conic-gradient(
            from var(--fab-angle),
            #ffd0b2 0deg,
            #ffb58d 70deg,
            #fe6c1c 150deg,
            #e85a10 220deg,
            #fe6c1c 290deg,
            #ffb58d 330deg,
            #ffd0b2 360deg
          );
        box-shadow:
          0 16px 40px rgba(254, 108, 28, 0.38),
          0 2px 0 rgba(255, 255, 255, 0.45) inset,
          0 -8px 18px rgba(180, 55, 0, 0.22) inset;
        animation: mp-fab-spin 7s linear infinite;
        transition: transform .18s ease, opacity .2s ease;
      }
      .mp-chrome-orb:active { transform: scale(.96); }
      .mp-chrome-orb:disabled { opacity: 0.72; cursor: default; }
      .mp-chrome-orb.is-listening {
        box-shadow:
          0 18px 48px rgba(254, 108, 28, 0.48),
          0 0 0 8px rgba(254, 108, 28, 0.08),
          0 2px 0 rgba(255, 255, 255, 0.5) inset,
          0 -8px 18px rgba(180, 55, 0, 0.22) inset;
      }
      .mp-voice-glass {
        background: linear-gradient(
          180deg,
          rgba(255, 255, 255, 0.72) 0%,
          rgba(255, 245, 238, 0.55) 100%
        );
        backdrop-filter: blur(14px) saturate(1.3);
        -webkit-backdrop-filter: blur(14px) saturate(1.3);
        border: 1px solid rgba(255, 181, 141, 0.35);
        box-shadow:
          0 8px 28px rgba(254, 108, 28, 0.06),
          0 1px 0 rgba(255, 255, 255, 0.8) inset;
      }

      @keyframes mp-fab-spin {
        to { --fab-angle: 360deg; }
      }
      @keyframes mp-voice-ring {
        0% { transform: scale(1); opacity: 0.45; }
        100% { transform: scale(1.7); opacity: 0; }
      }

      @media (prefers-reduced-motion: reduce) {
        .mp-fab,
        .mp-chrome-orb { animation: none; }
      }

      /* Overlays dentro del marco */
      .mp-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 40;
      }

      button:focus-visible, input:focus-visible, a:focus-visible {
        outline: 2px solid #5C4CC7;
        outline-offset: 2px;
      }

      /* En celular: pantalla completa, sin marco */
      @media (max-width: 520px) {
        body { background: #FFFFFF; background-image: none; }
        .mp-stage { padding: 0; }
        .mp-device {
          max-width: none;
          height: 100dvh;
          border-radius: 0;
          box-shadow: none;
        }
        .mp-nav {
          bottom: calc(10px + env(safe-area-inset-bottom));
          padding-bottom: 12px;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
