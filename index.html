<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#E7E7EE" />
    <link rel="icon" type="image/png" href="/logo-192.png" />
    <link rel="apple-touch-icon" href="/logo-192.png" />
    <title>MidatoPay × Arc</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: 'Poppins', -apple-system, system-ui, sans-serif;
        background: #E7E7EE;
        background-image: radial-gradient(900px 500px at 50% -10%, #F3EDFF 0%, #E7E7EE 60%);
      }

      /* Escenario: centra la app en pantallas grandes */
      .mp-stage {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 26px 16px;
      }

      /* Marco tipo teléfono */
      .mp-device {
        position: relative;
        width: 100%;
        max-width: 400px;
        height: min(840px, calc(100dvh - 52px));
        background: #F4F4F6;
        border-radius: 34px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        box-shadow:
          0 40px 90px rgba(24, 24, 44, .20),
          0 8px 24px rgba(24, 24, 44, .08),
          0 0 0 1px rgba(24, 24, 44, .05);
      }

      .mp-scroll {
        flex: 1;
        overflow-y: auto;
        overscroll-behavior: contain;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }
      .mp-scroll::-webkit-scrollbar { width: 0; }

      /* Barra inferior, anclada al marco */
      .mp-nav {
        position: absolute;
        left: 0; right: 0; bottom: 0;
        background: #fff;
        border-top: 1px solid #ECECF0;
        padding: 9px 18px 12px;
        display: flex;
        align-items: center;
      }
      .mp-fab {
        position: absolute;
        left: 50%;
        transform: translate(-50%, -25px);
        width: 60px; height: 60px;
        border-radius: 50%;
        background: #FF5A00;
        border: 4px solid #F4F4F6;
        color: #fff;
        font-size: 23px;
        cursor: pointer;
        display: grid;
        place-items: center;
        box-shadow: 0 8px 22px rgba(255, 90, 0, .34);
        transition: transform .15s ease;
      }
      .mp-fab:active { transform: translate(-50%, -25px) scale(.94); }

      /* Overlays dentro del marco */
      .mp-overlay {
        position: absolute;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 40;
      }

      button:focus-visible, input:focus-visible, a:focus-visible {
        outline: 2px solid #5C4CC7;
        outline-offset: 2px;
      }

      /* En celular: pantalla completa, sin marco */
      @media (max-width: 520px) {
        body { background: #F4F4F6; background-image: none; }
        .mp-stage { padding: 0; }
        .mp-device {
          max-width: none;
          height: 100dvh;
          border-radius: 0;
          box-shadow: none;
        }
        .mp-nav { padding-bottom: calc(12px + env(safe-area-inset-bottom)); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
