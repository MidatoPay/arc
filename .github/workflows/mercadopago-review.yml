name: Mercado Pago review
on:
  pull_request:
  push:
    branches: [main, mercadopago]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        cluster: [devnet, mainnet-beta]
    env:
      VITE_SOLANA_CLUSTER: ${{ matrix.cluster }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npm run functions:check
