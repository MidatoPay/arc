name: Mercado Pago review
on:
  pull_request:
  push:
    branches: [main, mercadopago]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      VITE_ARC_NETWORK: mainnet
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run deps:check
      - run: npm test
      - run: npm run build
      - run: npm run functions:check
